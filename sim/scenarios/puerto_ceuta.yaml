# Escenario SINTÉTICO de Atalaya (T1.9, REQ-FUN-005). Centro FICTICIO sobre mar abierto,
# redondeado a 0,01° (D-8): no reproduce ningún emplazamiento ni perímetro real. Todas las
# posiciones son desplazamientos locales en metros (este, norte, arriba) respecto al centro.
# launch_point equivale al origen probable: FCSE_ONLY (REQ-LEG-007).
