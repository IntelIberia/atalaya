# Mosquitto 2.0 (FASE 0): solo usuarios autenticados. TLS/mTLS por dispositivo: REQ-SEC-004 (FASE 5/12).
listener 1883
allow_anonymous false
password_file /mosquitto/passwd
# ACL por cuenta, topic y sitio (T1.16): generada al arrancar desde acl.tmpl.
acl_file /mosquitto/acl
persistence false
log_dest stdout
log_type error
log_type warning
