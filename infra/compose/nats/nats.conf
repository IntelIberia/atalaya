# NATS (FASE 0, T0.10). Las credenciales NO van en la línea de órdenes (visible en `ps` y en
# `docker inspect`): se resuelven aquí desde el entorno del contenedor (NATS_USER y NATS_PASSWORD,
# que compose toma de .env). Sintaxis según docs.nats.io/running-a-nats-service/configuration
# («Variables»): referencia `$NOMBRE` SIN comillas; entre comillas sería el literal "$NOMBRE".
# Advertencia de la documentación: un valor que empieza por cifra puede dar problemas. Comprobado
# con nats 2.15.1: valores hexadecimales como los de gen_local_secrets.sh autentican bien; un valor
# formado solo por cifras hace fallar el arranque (falla cerrado; probabilidad ~1e-10 con 48 hex).
listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}
