# Atalaya — stack local mínimo (FASE 0, ADR 0003). Solo localhost; sin credenciales por defecto:
# todas las contraseñas salen de .env (generado por `make bootstrap`, ignorado por git, Read
# denegado a Claude Code). Uso: make up / make smoke / make down.
name: atalaya

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    environment:
      MQTT_USER: ${MQTT_USER:?falta MQTT_USER en .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?falta MQTT_PASSWORD en .env}
    # El fichero de contraseñas (hash) se genera al arrancar a partir de las variables.
    command: >-
      sh -c 'mosquitto_passwd -c -b /mosquitto/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" &&
      chmod 0700 /mosquitto/passwd && chown mosquitto:mosquitto /mosquitto/passwd &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    # El healthcheck pasa la contraseña a mosquitto_sub por argv: es un proceso efímero DENTRO del
    # contenedor (solo lo ve quien ya tiene acceso al contenedor o al host); se acepta (P5).
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped

  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    environment:
      NATS_USER: ${NATS_USER:?falta NATS_USER en .env}
      NATS_PASSWORD: ${NATS_PASSWORD:?falta NATS_PASSWORD en .env}
    # Credenciales, JetStream (/data) y monitorización (8222) en nats.conf: nada secreto en argv.
    command: ["nats-server", "--config", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    # El fichero de configuración se genera al arrancar con printf (builtin de sh: no crea un proceso
    # con la contraseña en argv) y redis-server lo lee; el entrypoint oficial baja al usuario redis.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass "%s"\nappendonly yes\n' "$$REDIS_PASSWORD" > /tmp/redis.conf &&
        chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb-ha:pg16.15-ts2.30.2@sha256:7ed6848962519916b3dc78586ebf3fbd3e39869b4e692653c50c5d4e52887d88
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: atalaya
    volumes:
      - pg-data:/home/postgres/pgdata
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-extensiones.sql:ro
      - ./postgres/99-endurecer-pg_hba.sh:/docker-entrypoint-initdb.d/99-endurecer-pg_hba.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d atalaya"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped

volumes:
  nats-data:
  redis-data:
  pg-data:
