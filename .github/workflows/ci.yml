# CI ligera (ADR 0007): lint, tipos, tests, cobertura, guardarraíles, especificación,
# trazabilidad y regresión. Lo pesado (mutación, e2e, compose) se ejecuta en local con evidencia.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Herramientas fijadas (binarios verificados por SHA-256)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o "$HOME/bin/buf" https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64
          echo "fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b  $HOME/bin/buf" | sha256sum -c -
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz -C "$HOME/bin" gitleaks && rm gl.tgz
          chmod +x "$HOME/bin/buf" "$HOME/bin/gitleaks"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Entorno
        run: |
          make bootstrap
          make doctor
      - name: make check
        run: make check
      - name: Compatibilidad de contratos Protobuf
        run: make proto-breaking
      - name: make regress
        run: make regress
      - name: Guardarraíles sobre el rango del PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/guardrails.sh --range "origin/${BASE_REF}...HEAD"
      - name: Historia del PR sin commits WIP ni «sin verificar»
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I scripts/check_pr_commits.py --range "origin/${BASE_REF}..HEAD"
