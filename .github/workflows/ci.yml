# CI ligera (ADR 0007): lint, tipos, tests, cobertura, guardarraíles, especificación,
# trazabilidad y regresión. Lo pesado (mutación, e2e, compose) se ejecuta en local con evidencia.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Entorno
        run: make bootstrap
      - name: make check
        run: make check
      - name: make regress
        run: make regress
      - name: Guardarraíles sobre el rango del PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/guardrails.sh --range "origin/${BASE_REF}...HEAD"
