[project]
name = "atalaya-acoustic-pilot"
version = "0.1.0"
description = "Piloto acústico exploratorio local, aislado de la plataforma Atalaya"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.16.3",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
yamnet = [
    "tensorflow==2.16.2",
    "tensorflow-hub==0.16.1",
    "tf-keras==2.16.0",
]
# Hito 2 (ADR 0017): captura en memoria e inferencia ONNX en el Mac Intel. Versiones exactas:
# onnxruntime 1.23.2 es la última con rueda macOS x86_64 cp312; ambas MIT (T0.1).
live = [
    "onnxruntime==1.23.2",
    "sounddevice==0.5.6",
]

[dependency-groups]
# onnxruntime también en dev: los tests del cargador (H2.6) ejecutan un ONNX diminuto real.
dev = ["pytest==8.4.2", "ruff==0.14.3", "onnxruntime==1.23.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["req(id): requisitos que verifica el test (trazabilidad del hito 2)"]

[tool.ruff]
line-length = 100
target-version = "py312"
# El cuaderno se genera con build_colab.py; su código probado se analiza en los .py de origen.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
