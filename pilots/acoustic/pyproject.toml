[project]
name = "atalaya-acoustic-pilot"
version = "0.1.0"
description = "Piloto acústico exploratorio local, aislado de la plataforma Atalaya"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.16.3",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
yamnet = [
    "tensorflow==2.16.2",
    "tensorflow-hub==0.16.1",
    "tf-keras==2.16.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# El cuaderno se genera con build_colab.py; su código probado se analiza en los .py de origen.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
