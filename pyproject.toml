[project]
name = "atalaya"
version = "0.0.0"
description = "Atalaya: detección, seguimiento y alerta de drones (solo detección)"
requires-python = ">=3.12,<3.13"
license = { text = "LicenseRef-Proprietary" }
dependencies = [
    "jsonschema==4.26.0",
    "paho-mqtt==2.2.0",
    "protobuf==7.36.2",
    "pyyaml==6.0.3",
    "zstandard==0.25.0",
]

[dependency-groups]
dev = [
    # pytest 9 eliminó Item._nodeid, que usa mutmut 3.7 (la 3.8 exige libcst 1.9): tech-debt
    "pytest>=8,<9",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "mutmut>=3",
    # libcst 1.9 no publica wheel macOS x86_64 (Mac Intel del equipo): ver docs/tech-debt.md
    "libcst>=1.8.6,<1.9",
    "types-pyyaml>=6",
    "defusedxml>=0.7",
    "types-defusedxml>=0.7",
    "grpcio-tools==1.85.1",
    "types-protobuf==7.35.1.20260906",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integracion'"
junit_family = "xunit1"
pythonpath = ["proto/gen/python", "proto/python"]
markers = [
    "req(id): requisitos que verifica el test (trazabilidad)",
    "subproceso: lanza un script en otro proceso (se excluye de mutmut)",
    "integracion: necesita el stack de compose en marcha (make up && make smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "mutants", "proto/gen/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["proto/gen/python", "proto/python"]
exclude = ["third_party/", "mutants/"]

[[tool.mypy.overrides]]
module = ["atalaya.v1.*", "atalaya.sim.v1.*"]
ignore_errors = true

[tool.mutmut]
source_paths = [
    "scripts/guardrails.py",
    "src/atalaya_contracts",
]
only_mutate = [
    "scripts/guardrails.py",
    "src/atalaya_contracts/redact.py",
    "src/atalaya_contracts/log_projection.py",
    "src/atalaya_contracts/validate.py",
]
pytest_add_cli_args_test_selection = [
    "tests/guardrails/",
    "tests/contracts/test_uncertainty.py",
    "tests/contracts/test_redact.py",
    "tests/sim/test_logs.py",
]
also_copy = [
    "scripts/",
    "tests/",
    "proto/",
    "pyproject.toml",
]
# En mutmut, importar contratos desde mutants/src; el pythonpath normal de pytest
# apuntaría a proto/python y ocultaría el módulo mutado.
pytest_add_cli_args = ["-m", "not subproceso", "-o", "pythonpath=proto/gen/python"]

[tool.atalaya]
# Umbrales de calidad (ADR 0006). Cambiarlos exige un ADR nuevo.
coverage_branch_min = 90
coverage_critical = ["scripts/guardrails.py", "scripts/traceability.py", "scripts/evidence.py", "scripts/mutation_report.py", "proto/python/atalaya_contracts/validate.py", "proto/python/atalaya_contracts/redact.py", "proto/python/atalaya_contracts/log_projection.py"]
mutation_threshold = 0.80
mutation_critical = ["scripts/guardrails.py", "proto/python/atalaya_contracts/redact.py", "proto/python/atalaya_contracts/log_projection.py", "proto/python/atalaya_contracts/validate.py"]
