[project]
name = "atalaya"
version = "0.0.0"
description = "Atalaya: detección, seguimiento y alerta de drones (solo detección)"
requires-python = ">=3.12,<3.13"
license = { text = "LicenseRef-Proprietary" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "mutmut>=3",
    # libcst 1.9 no publica wheel macOS x86_64 (Mac Intel del equipo): ver docs/tech-debt.md
    "libcst>=1.8.6,<1.9",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["req(id): requisitos que verifica el test (trazabilidad)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["third_party/", "mutants/"]
