[project]
name = "atalaya"
version = "0.0.0"
description = "Atalaya: detección, seguimiento y alerta de drones (solo detección)"
requires-python = ">=3.12,<3.13"
license = { text = "LicenseRef-Proprietary" }
dependencies = []

[dependency-groups]
dev = [
    # pytest 9 eliminó Item._nodeid, que usa mutmut 3.7 (la 3.8 exige libcst 1.9): tech-debt
    "pytest>=8,<9",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "mutmut>=3",
    # libcst 1.9 no publica wheel macOS x86_64 (Mac Intel del equipo): ver docs/tech-debt.md
    "libcst>=1.8.6,<1.9",
    "pyyaml>=6",
    "types-pyyaml>=6",
    "defusedxml>=0.7",
    "types-defusedxml>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integracion'"
junit_family = "xunit1"
markers = [
    "req(id): requisitos que verifica el test (trazabilidad)",
    "subproceso: lanza un script en otro proceso (se excluye de mutmut)",
    "integracion: necesita el stack de compose en marcha (make up && make smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["third_party/", "mutants/"]

[tool.mutmut]
paths_to_mutate = ["scripts/guardrails.py"]
tests_dir = ["tests/guardrails/"]
also_copy = ["scripts/", "tests/", "pyproject.toml"]
pytest_add_cli_args = ["-m", "not subproceso"]

[tool.atalaya]
# Umbrales de calidad (ADR 0006). Cambiarlos exige un ADR nuevo.
coverage_branch_min = 90
coverage_critical = ["scripts/guardrails.py", "scripts/traceability.py", "scripts/evidence.py", "scripts/mutation_report.py"]
mutation_threshold = 0.80
mutation_critical = ["scripts/guardrails.py"]
